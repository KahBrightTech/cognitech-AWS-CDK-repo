apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: "[[account_name]]-[[environment]]-nodepool"
spec:
  template:
    spec:
      nodeClassRef:
        group: karpenter.k8s.aws
        kind: EC2NodeClass
        name: "[[account_name]]-[[environment]]-nodeclass"
      requirements:
      - key: karpenter.k8s.aws/instance-category
        operator: In
        values: [t, m, c]
      - key: karpenter.sh/capacity-type
        operator: In
        values: [on-demand]
      - key: kubernetes.io/arch
        operator: In
        values: [amd64]
      expireAfter: 720h
  limits:
    cpu: "8"
  disruption:
    consolidationPolicy: WhenEmptyOrUnderutilized
    consolidateAfter: 1m
