account_id: "444455556666"
region: us-east-1

common:
  account_name: int-production
  region_prefix: use1
  global: false
  account_name_abr: intprod
  environment_abr: prd
  tags:
    Build-method: aws-cdk
    Environment: production
    ManagedBy: aws-cdk/cognitech-AWS-CDK-repo
    Owner: kbrigthain@gmail.com
    Compliance: hippaa

network:
  name: prd
  cidr_block: 10.30.0.0/16
  azs: 3

  # Private subnets with one NAT gateway per AZ, so egress survives a zone outage.
  private_subnets: true
  # nat_gateways omitted = one per AZ. Set to 1 to save money in non-production.

  # Exact subnet ranges, one per AZ in order. Omit a tier to have it carved
  # from cidr_block using cidr_mask.
  public_subnet_cidrs:
    - 10.30.0.0/20
    - 10.30.16.0/20
    - 10.30.32.0/20
  private_subnet_cidrs:
    - 10.30.64.0/20
    - 10.30.80.0/20
    - 10.30.96.0/20
