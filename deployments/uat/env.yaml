account_id: "111122223333"
region: us-east-1
deploy_order: 10

common:
  # Produces names like int-production-use1-cdk-uat-vpc
  account_name: int-production
  region_prefix: use1
  # Marks these resources as CDK-built so they never collide with the Terraform
  # estate during migration. Remove the key to drop the segment entirely.
  qualifier: cdk
  # Applied to every taggable resource in the stack. `Name` is NOT listed here —
  # it is derived per resource from CommonProps.resource_name().
  tags:
    Build-method: aws-cdk
    Environment: user-acceptance-test
    ManagedBy: aws-cdk/cognitech-AWS-CDK-repo-int-production-Tenant-account-uat-primary
    Owner: kbrigthain@gmail.com
    Compliance: hippaa

networks:
# Explicit CIDRs: one per availability zone, in the same order.
- name: uat
  cidr_block: 10.20.0.0/16
  availability_zones:
  - us-east-1a
  - us-east-1b
  nat_gateways: 1
  subnet_groups:
  - name: edge
    type: public
    cidrs:
    - 10.20.0.0/20
    - 10.20.16.0/20
  - name: app
    type: private
    cidrs:
    - 10.20.64.0/20
    - 10.20.80.0/20
  - name: data
    type: isolated
    cidrs:
    - 10.20.128.0/20
    - 10.20.144.0/20

# Public-only VPC: no private subnets, so no NAT gateways.
- name: dmz
  cidr_block: 10.21.0.0/16
  availability_zones:
  - us-east-1a
  - us-east-1b
  nat_gateways: 0
  subnet_groups:
  - name: edge
    type: public
    cidrs:
    - 10.21.0.0/20
    - 10.21.16.0/20
