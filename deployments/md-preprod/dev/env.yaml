# Inherits ../base.yaml; values defined here override account defaults.
########################################
###### Common tags ######
########################################
common:
  tags:
    Environment: development

########################################
###### Network Configuration ######
########################################
network:
  name: "[[environment]]"
  cidr_block: 10.20.0.0/16
  azs: 3 # 1 to 4 availability zones
  private_subnets: false
  public_subnet_cidrs:
    - 10.20.0.0/24
    - 10.20.1.0/24
    - 10.20.2.0/24
########################################
###### Network Security Groups ######
########################################
security_groups:
  - name: eks-cluster
    description: EKS control plane API access from worker nodes, supplementing the EKS-managed cluster security group
    ingress:
      - description: Inbound traffic from eks nodes on tcp port 443(HTTPS) to eks cluster
        source: eks-nodes
        ports: 443

  - name: eks-nodes
    description: EKS worker node networking for node communication, kubelet access, admission webhooks and load balancer targets
    ingress:
      - description: Inbound traffic from eks nodes on all protocols and ports to eks nodes
        source: eks-nodes
        protocol: all
      - description: Inbound traffic from eks cluster on tcp port 10250(kubelet) to eks nodes
        source: eks-cluster
        ports: 10250
      - description: Inbound traffic from eks cluster on tcp port 443(HTTPS) to eks nodes
        source: eks-cluster
        ports: 443
      - description: Inbound traffic from alb on tcp ports 30000-32767(NodePort) to eks nodes
        source: alb
        ports: 30000-32767
      - description: Inbound traffic from nlb on tcp ports 30000-32767(NodePort) to eks nodes
        source: nlb
        ports: 30000-32767

  - name: alb
    description: Public application load balancer listener access for HTTP and HTTPS traffic to cluster applications
    ingress:
      - description: Inbound traffic from 0.0.0.0/0 on tcp port 443(HTTPS) to alb
        source: 0.0.0.0/0
        ports: 443
      - description: Inbound traffic from 0.0.0.0/0 on tcp port 80(HTTP) to alb
        source: 0.0.0.0/0
        ports: 80

  - name: nlb
    description: Default public network load balancer security group for HTTP and HTTPS listeners and worker node targets
    ingress:
      - description: Inbound traffic from 0.0.0.0/0 on tcp port 80(HTTP) to nlb
        source: 0.0.0.0/0
        ports: 80
      - description: Inbound traffic from 0.0.0.0/0 on tcp port 443(HTTPS) to nlb
        source: 0.0.0.0/0
        ports: 443

  - name: nginx-nlb
    description: Dedicated public NGINX network load balancer HTTP and HTTPS listener access
    ingress:
      - description: Public HTTP access to the NGINX network load balancer
        source: 0.0.0.0/0
        ports: 80
      - description: Public HTTPS access to the NGINX network load balancer
        source: 0.0.0.0/0
        ports: 443
########################################
###### IAM Configuration ######
########################################
iam:
  roles:
    - name: eks-cluster
      description: EKS control plane service role
      trust_policy: policies/eks-cluster-trust.yaml
      managed_policies:
        - AmazonEKSClusterPolicy
    - name: eks-nodes
      description: EKS EC2 worker node role
      assumed_by: ec2.amazonaws.com
      managed_policies:
        - AmazonEKSWorkerNodePolicy
        - AmazonEC2ContainerRegistryPullOnly
        - AmazonEKS_CNI_Policy
      managed_policy_arns: []
      custom_policies:
        TestReadConfig: policies/example-read-config.yaml
    - name: ec2
      description: EC2 instance profile role for [[environment]]
      trust_policy: policies/ec2-trust.json
      managed_policy_arns:
        - arn:aws:iam::aws:policy/AmazonS3ReadOnlyAccess
        - arn:aws:iam::aws:policy/AmazonEC2ReadOnlyAccess
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
        - arn:aws:iam::aws:policy/AdministratorAccess
      # Attaches the IAM policy; the instance profile is created under iam.instance_profiles below.
      customer_managed_policies: [ec2-instance-profile]
    - name: default
      description: Default IAM role for [[environment]]
      trust_policy: policies/ec2-trust.json
      managed_policy_arns:
        - arn:aws:iam::aws:policy/AmazonS3ReadOnlyAccess
        - arn:aws:iam::aws:policy/AmazonEC2ReadOnlyAccess
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
      customer_managed_policies: [default]
    - name: source-replication
      description: IAM role for the [[environment]] replication rule
      trust_policy: policies/s3-trust.json
      customer_managed_policies: [source-replication]
  policies:
    - name: ec2-instance-profile
      description: EC2 instance permission for instances
      document: policies/ec2-instance-s3-permissions.json
    - name: default
      description: "[[environment]] default role policy"
      document: policies/ec2-instance-s3-permissions.json
    - name: source-replication
      description: IAM policy for [[environment]] source replication
      document: policies/s3-source-replication.json
  instance_profiles:
    - name: eks-nodes
      role: eks-nodes
    - name: ec2
      role: ec2

########################################
###### S3 Buckets ######
########################################
s3_buckets:
  - name: app-bucket
    description: The application bucket for different apps
    versioning: true
    policy: policies/s3-app-bucket.json
    policy_variables:
      github_oidc_role: arn:aws:iam::[[account_id]]:role/github-oidc-cdk-deploy-[[environment]]
  - name: audit-bucket
    description: The audit bucket for different apps
    versioning: true
    policy: policies/s3-audit-bucket.json
    policy_variables:
      github_oidc_role: arn:aws:iam::[[account_id]]:role/github-oidc-cdk-deploy-[[environment]]
  - name: software-bucket
    description: The software bucket for different apps
    versioning: true
    objects:
      - key: Ansible_Tower/

########################################
###### Key Pairs and Certificates ######
########################################
key_pairs:
  # Rename "eks" here; the secret name and launch-template references follow this anchor.
  - name: &eks_node_key_pair eks
    removal_policy: destroy
    create_secret: true
    secret_removal_policy: destroy
    secret_name: *eks_node_key_pair
    secret_description: Private key for the [[account_name]] [[environment]] VPC

certificates:
  - name: "[[environment]]"
    domain_name: "*.[[environment]].[[domain_name]]"
    validation_method: DNS
    zone_name: "[[domain_name]]"

########################################
###### EKS ######
########################################
eks:
  - name: main
    version: "1.36"
    role: eks-cluster
    subnet_tier: public
    security_groups: [eks-cluster]
    endpoint_public_access: true
    endpoint_private_access: false
    oidc_provider: true
    access_entries:
      admin:
        principal_arns: [admin]
        policy_arn: arn:aws:eks::aws:cluster-access-policy/AmazonEKSClusterAdminPolicy
      system-admin:
        principal_arns: [system-admin]
        policy_arn: arn:aws:eks::aws:cluster-access-policy/AmazonEKSAdminPolicy
        namespaces: [infogrid, healthpath]
      # Maps both the configured eks-cluster IAM role and the readonly principal alias to these groups.
      readonly:
        roles: [eks-cluster]
        principal_arns: [readonly]
        kubernetes_groups: [cognitech-viewers, infogrid]
      audit:
        principal_arns: [audit]
        policy_arn: arn:aws:eks::aws:cluster-access-policy/AmazonEKSViewPolicy
        kubernetes_groups: [cognitech-viewers]
    namespaces:
      - name: infogrid
        labels:
          team: infogrid-devops
      - name: movienight
        labels:
          app: movienight
      - name: healthpath
        labels:
          app: healthpath
        resource_quota:
          file: policies/healthpath_resource_quota.yaml
      - name: pulsehub
        labels:
          app: pulsehub
      - name: nova
        labels:
          app: nova
    rbac:
      cluster_roles:
        - name: cognitech-view
          rules:
            - api_groups: ["*"]
              resources: [deployments, pods, services]
              verbs: [get, list, watch]
      cluster_role_bindings:
        - name: view-binding
          cluster_role: cognitech-view
          subjects:
            - kind: Group
              name: cognitech-viewers
              api_group: rbac.authorization.k8s.io
      roles:
        - name: infogrid
          namespace: infogrid
          rules:
            - api_groups: ["*"]
              resources: [deployments, pods, services]
              verbs: [get, list, watch]
      role_bindings:
        - name: infogrid-binding
          namespace: infogrid
          role: infogrid
          subjects:
            - kind: Group
              name: infogrid
              api_group: rbac.authorization.k8s.io
    service_accounts:
      - name: healthpath-secrets
        namespace: healthpath
        identity: pod_identity
        policy: policies/healthpath-secrets.yaml
      - name: infogrid-s3
        namespace: infogrid
        identity: irsa
        policy: policies/infogrid-s3.yaml
    compute:
      launch_templates:
        - name: general
          key_pair: *eks_node_key_pair
          security_groups: [eks-nodes]
          volume_size: 20
          volume_type: gp3
      node_groups:
        - name: general
          role: eks-nodes
          launch_template: general
          labels:
            workload-type: system
          taints:
            - key: workload-type
              value: system
              effect: NO_SCHEDULE
          subnet_tier: public
          instance_types: [t3.large]
          min_size: 2
          desired_size: 2
          max_size: 3
      # Requires eks-pod-identity-agent in eks_addons and running worker nodes.
      karpenter:
        chart_version: 1.15.0
        node_role: eks-nodes
        replicas: 1
        subnet_tier: public
        security_groups: [eks-nodes]
        values:
          nodeSelector:
            workload-type: system
          tolerations:
            - {
                key: workload-type,
                operator: Equal,
                value: system,
                effect: NoSchedule,
              }
        node_class_manifest: policies/karpenter/[[account_name]]-[[environment]]-nodeclass.yaml
        node_pool_manifest: policies/karpenter/[[account_name]]-[[environment]]-nodepool.yaml
eks_addons:
  - cluster: main
    addons:
      - name: vpc-cni
      - name: coredns
        configuration_values:
          nodeSelector: { workload-type: system }
          tolerations:
            - { key: node-role.kubernetes.io/control-plane, effect: NoSchedule }
            - {
                key: workload-type,
                operator: Equal,
                value: system,
                effect: NoSchedule,
              }
      - name: kube-proxy
      - name: eks-pod-identity-agent
        configuration_values:
          tolerations:
            - { operator: Exists }
      - name: aws-ebs-csi-driver
        configuration_values:
          controller:
            nodeSelector: { workload-type: system }
            tolerations:
              - { operator: Exists, effect: NoExecute, tolerationSeconds: 300 }
              - {
                  key: workload-type,
                  operator: Equal,
                  value: system,
                  effect: NoSchedule,
                }
          node:
            tolerateAllTaints: true
      - name: aws-efs-csi-driver
        configuration_values:
          controller:
            nodeSelector: { workload-type: system }
            tolerations:
              - {
                  key: workload-type,
                  operator: Equal,
                  value: system,
                  effect: NoSchedule,
                }
          node:
            tolerations: [{ operator: Exists }]
      - name: aws-fsx-csi-driver
        configuration_values:
          controller:
            nodeSelector: { workload-type: system }
            tolerations:
              - { operator: Exists, effect: NoExecute, tolerationSeconds: 300 }
              - {
                  key: workload-type,
                  operator: Equal,
                  value: system,
                  effect: NoSchedule,
                }
          node:
            tolerations: [{ operator: Exists }]
      - name: aws-secrets-store-csi-driver-provider
        configuration_values:
          # Both the provider and CSI driver are node-wide DaemonSets.
          tolerations: [{ operator: Exists }]
          secrets-store-csi-driver:
            linux:
              tolerations: [{ operator: Exists }]
      - name: metrics-server
        configuration_values:
          nodeSelector: { workload-type: system }
          tolerations:
            - {
                key: workload-type,
                operator: Equal,
                value: system,
                effect: NoSchedule,
              }
      - name: external-dns
        configuration_values:
          nodeSelector: { workload-type: system }
          tolerations:
            - {
                key: workload-type,
                operator: Equal,
                value: system,
                effect: NoSchedule,
              }
      - name: cert-manager
        pod_identity: true
        cluster_issuer:
          name: "[[environment]]"
          dns_zone: "[[domain_name]]"
          staging: false
        configuration_values:
          nodeSelector: { workload-type: system }
          tolerations:
            - {
                key: workload-type,
                operator: Equal,
                value: system,
                effect: NoSchedule,
              }
          cainjector:
            nodeSelector: { workload-type: system }
            tolerations:
              - {
                  key: workload-type,
                  operator: Equal,
                  value: system,
                  effect: NoSchedule,
                }
          webhook:
            nodeSelector: { workload-type: system }
            tolerations:
              - {
                  key: workload-type,
                  operator: Equal,
                  value: system,
                  effect: NoSchedule,
                }
      - name: amazon-cloudwatch-observability
        configuration_values:
          tolerations: [{ operator: Exists }]
          manager:
            nodeSelector: { workload-type: system }
            tolerations:
              - {
                  key: workload-type,
                  operator: Equal,
                  value: system,
                  effect: NoSchedule,
                }
          kubeStateMetrics:
            nodeSelector: { workload-type: system }
            tolerations:
              - {
                  key: workload-type,
                  operator: Equal,
                  value: system,
                  effect: NoSchedule,
                }
    aws_load_balancer_controller:
      enabled: true
      chart_version: 3.6.0
      values:
        nodeSelector: { workload-type: system }
        tolerations:
          - {
              key: workload-type,
              operator: Equal,
              value: system,
              effect: NoSchedule,
            }
    storage_class:
      name: gp3
    # Native Secrets Store EKS add-on is enabled above; keep the Helm alternative disabled.
    # secrets_store_csi:
    #   enabled: false
    #   chart_version: 3.1.4
    #   values:
    #     tolerations: [{ operator: Exists }]
    #     secrets-store-csi-driver:
    #       install: true
    #       linux:
    #         tolerations: [{ operator: Exists }]
    # SecretProviderClass must be in the consuming pod's namespace.
    # secret_provider_classes:
    # - name: healthpath-secrets
    #   namespace: healthpath
    #   parameters:
    #     region: "[[region]]"
    #     usePodIdentity: "true" # use "false" with an IRSA service account
    #     objects: |
    #       - objectName: "arn:aws:secretsmanager:[[region]]:[[account_id]]:secret:REPLACE-ME"
    #         objectType: secretsmanager
    # Shared settings for the ALB ingresses and NLB services below; one ALB is
    # shared through the ingress group.
    load_balancer_defaults:
      scheme: internet-facing
      subnet_tier: public
      certificate: "[[environment]]"
      security_groups: [alb]
      group_name: "[[environment]]-shared"
    argocd:
      chart_version: 10.10.5
      host: argocd.[[environment]].[[domain_name]]
      ha: false
      values:
        global:
          nodeSelector: { workload-type: system }
          tolerations:
            - {
                key: workload-type,
                operator: Equal,
                value: system,
                effect: NoSchedule,
              }
      sso:
        enabled: false # set true after creating the Identity Center SAML application
        # sso_url: https://portal.sso.[[region]].amazonaws.com/saml/assertion/<app-id>
        # sso_issuer: https://portal.sso.[[region]].amazonaws.com/saml/assertion/<app-id>
        # ca_pem_file: policies/argocd-identity-center-signing-cert.pem
        rbac_policies_file: policies/argocd-rbac-policy.csv
        rbac_default_policy: role:readonly
    nginx_ingress:
      - name: public
        chart_version: 2.8.0
        ingress_class_name: nginx
        replica_count: 1
        service:
          scheme: internet-facing
          subnet_tier: public
          security_groups: [nginx-nlb]
          certificate: "[[environment]]"
        values:
          controller:
            nodeSelector: { workload-type: system }
            tolerations:
              - {
                  key: workload-type,
                  operator: Equal,
                  value: system,
                  effect: NoSchedule,
                }
    #   gateway_api:
    #     # NGINX Gateway Fabric; Gateways you create get an NLB
    #     chart_version: 2.8.0
    #     values:
    #       nginxGateway:
    #         nodeSelector: {workload-type: system}
    #         tolerations:
    #         - {key: workload-type, operator: Equal, value: system, effect: NoSchedule}
    #       nginx:
    #         pod:
    #           nodeSelector: {workload-type: system}
    #           tolerations:
    #           - {key: workload-type, operator: Equal, value: system, effect: NoSchedule}
    #       certGenerator:
    #         nodeSelector: {workload-type: system}
    #         tolerations:
    #         - {key: workload-type, operator: Equal, value: system, effect: NoSchedule}
    kubecost:
      chart_version: 2.9.7
      host: kubecost.[[environment]].[[domain_name]]
      values:
        nodeSelector: { workload-type: system }
        tolerations:
          - {
              key: workload-type,
              operator: Equal,
              value: system,
              effect: NoSchedule,
            }
        forecasting:
          nodeSelector: { workload-type: system }
          tolerations:
            - {
                key: workload-type,
                operator: Equal,
                value: system,
                effect: NoSchedule,
              }
        finopsagent:
          nodeSelector: { workload-type: system }
          tolerations:
            - {
                key: workload-type,
                operator: Equal,
                value: system,
                effect: NoSchedule,
              }
        prometheus:
          server:
            nodeSelector: { workload-type: system }
            tolerations:
              - {
                  key: workload-type,
                  operator: Equal,
                  value: system,
                  effect: NoSchedule,
                }
          alertmanager:
            nodeSelector: { workload-type: system }
            tolerations:
              - {
                  key: workload-type,
                  operator: Equal,
                  value: system,
                  effect: NoSchedule,
                }
          nodeExporter:
            tolerations: [{ operator: Exists }]
        grafana:
          nodeSelector: { workload-type: system }
          tolerations:
            - {
                key: workload-type,
                operator: Equal,
                value: system,
                effect: NoSchedule,
              }
        networkCosts:
          tolerations: [{ operator: Exists }]
    awx_operator:
      chart_version: 3.2.1
      create_instance: true
      host: awx.[[environment]].[[domain_name]]
      values:
        operator-controller:
          spec:
            template:
              spec:
                nodeSelector: { workload-type: system }
                tolerations:
                  - {
                      key: workload-type,
                      operator: Equal,
                      value: system,
                      effect: NoSchedule,
                    }
        AWX:
          spec:
            node_selector: |
              karpenter.sh/nodepool: default
            postgres_selector: |
              karpenter.sh/nodepool: default
