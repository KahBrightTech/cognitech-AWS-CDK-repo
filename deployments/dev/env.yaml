account_id: "533267408704"
region: us-east-1
common:
  account_name: md-preproduction
  region_prefix: use1
  global: false
  account_name_abr: mdpreprod
  environment_abr: dev
  tags:
    Build-method: aws-cdk
    Environment: development
    ManagedBy: aws-cdk/cognitech-AWS-CDK-repo
    Owner: kbrigthain@gmail.com
    Compliance: FedRAMP
########################################
###### Network Configuration ######
########################################
network:
  name: dev
  cidr_block: 10.20.0.0/16
  azs: 3 # 1 to 4 availability zones
  private_subnets: false
  public_subnet_cidrs:
  - 10.20.0.0/24
  - 10.20.1.0/24
  - 10.20.2.0/24
########################################
###### Network Security Groups ######
########################################
security_groups:
- name: eks-cluster
  description: EKS control plane, additional to the group EKS creates itself
  ingress:
  - description: API server from the nodes
    source: eks-nodes
    ports: 443

- name: eks-nodes
  description: EKS worker nodes
  ingress:
  - description: Node to node, all ports
    source: eks-nodes
    protocol: all
  - description: Control plane to kubelet
    source: eks-cluster
    ports: 10250
  - description: Control plane to webhooks and extension API servers
    source: eks-cluster
    ports: 443
  - description: Ingress controller to the NodePort range
    source: alb
    ports: 30000-32767

- name: alb
  description: Public load balancer in front of the cluster
  ingress:
  - description: HTTPS from anywhere
    source: 0.0.0.0/0
    ports: 443
  - description: HTTP from anywhere, redirected to HTTPS
    source: 0.0.0.0/0
    ports: 80
########################################
###### IAM Configuration ######
########################################
iam:
  roles:
  - name: eks-cluster
    description: EKS control plane service role
    trust_policy: policies/eks-cluster-trust.yaml
    managed_policies:
    - AmazonEKSClusterPolicy
  - name: eks-nodes
    description: EKS EC2 worker node role
    assumed_by: ec2.amazonaws.com
    managed_policies:
    - AmazonEKSWorkerNodePolicy
    - AmazonEC2ContainerRegistryPullOnly
    - AmazonEKS_CNI_Policy
    managed_policy_arns: []
    custom_policies:
      TestReadConfig: policies/example-read-config.yaml
  # Mirrors Terraform ec2_profiles/iam_roles for md-preproduction Dev.
  - name: ec2
    description: EC2 instance profile role for dev
    trust_policy: policies/ec2-trust.json
    managed_policy_arns:
    - arn:aws:iam::aws:policy/AmazonS3ReadOnlyAccess
    - arn:aws:iam::aws:policy/AmazonEC2ReadOnlyAccess
    - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
    - arn:aws:iam::aws:policy/AdministratorAccess # as in Terraform; grants instances full admin
    customer_managed_policies: [ ec2-instance-profile ]
  - name: default
    description: Default IAM role for dev
    trust_policy: policies/ec2-trust.json
    managed_policy_arns:
    - arn:aws:iam::aws:policy/AmazonS3ReadOnlyAccess
    - arn:aws:iam::aws:policy/AmazonEC2ReadOnlyAccess
    - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
    customer_managed_policies: [ default ]
  - name: source-replication
    description: IAM role for the dev replication rule
    trust_policy: policies/s3-trust.json
    customer_managed_policies: [ source-replication ]
  policies:
  - name: ec2-instance-profile
    description: EC2 instance permission for instances
    document: policies/ec2-instance-s3-permissions.json
  - name: default
    description: dev default role policy
    document: policies/ec2-instance-s3-permissions.json
  - name: source-replication
    description: IAM policy for dev source replication
    document: policies/s3-source-replication.json
  instance_profiles:
  - name: eks-nodes
    role: eks-nodes
  - name: ec2
    role: ec2

########################################
###### S3 Buckets ######
########################################
s3_buckets:
- name: app-bucket
  description: The application bucket for different apps
  versioning: true
  policy: policies/s3-app-bucket.json
  policy_variables:
    github_oidc_role: arn:aws:iam::533267408704:role/github-oidc-cdk-deploy-dev
- name: audit-bucket
  description: The audit bucket for different apps
  versioning: true
  policy: policies/s3-audit-bucket.json
  policy_variables:
    github_oidc_role: arn:aws:iam::533267408704:role/github-oidc-cdk-deploy-dev
- name: software-bucket
  description: The software bucket for different apps
  versioning: true
  objects:
  - key: Ansible_Tower/

########################################
###### Key Pairs and Certificates ######
########################################
key_pairs:
- name: key-pair
  create_secret: true
  secret_name: ec2-private-key-pairs
  secret_description: Private key for the dev VPC

certificates:
- name: dev
  domain_name: "*.dev.titancoretech.net"
  validation_method: DNS
  zone_name: titancoretech.net

########################################
###### EKS ######
########################################
