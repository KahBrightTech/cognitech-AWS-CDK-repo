account_id: "533267408704"
region: us-east-1
common:
  account_name: md-preproduction
  region_prefix: use1
  global: false
  account_name_abr: mdpreprod
  environment_abr: dev
  tags:
    Build-method: aws-cdk
    Environment: development
    ManagedBy: aws-cdk/cognitech-AWS-CDK-repo
    Owner: kbrigthain@gmail.com
    Compliance: FedRAMP
########################################
###### Network Configuration ######
########################################
network:
  name: dev
  cidr_block: 10.20.0.0/16
  azs: 3 # 1 to 4 availability zones
  private_subnets: false
  public_subnet_cidrs:
  - 10.20.0.0/24
  - 10.20.1.0/24
  - 10.20.2.0/24
########################################
###### Network Security Groups ######
########################################
security_groups:
- name: eks-cluster
  description: EKS control plane, additional to the group EKS creates itself
  ingress:
  - description: API server from the nodes
    source: eks-nodes
    ports: 443

- name: eks-nodes
  description: EKS worker nodes
  ingress:
  - description: Node to node, all ports
    source: eks-nodes
    protocol: all
  - description: Control plane to kubelet
    source: eks-cluster
    ports: 10250
  - description: Control plane to webhooks and extension API servers
    source: eks-cluster
    ports: 443
  - description: Ingress controller to the NodePort range
    source: alb
    ports: 30000-32767

- name: alb
  description: Public load balancer in front of the cluster
  ingress:
  - description: HTTPS from anywhere
    source: 0.0.0.0/0
    ports: 443
  - description: HTTP from anywhere, redirected to HTTPS
    source: 0.0.0.0/0
    ports: 80
########################################
###### IAM Configuration ######
########################################
iam:
  roles:
    - name: eks-cluster
      description: EKS control plane service role
      trust_policy: policies/eks-cluster-trust.yaml
      managed_policies:
        - AmazonEKSClusterPolicy
    - name: eks-nodes
      description: EKS EC2 worker node role
      assumed_by: ec2.amazonaws.com
      managed_policies:
        - AmazonEKSWorkerNodePolicy
        - AmazonEC2ContainerRegistryPullOnly
        - AmazonEKS_CNI_Policy
      managed_policy_arns: []
      custom_policies:
        TestReadConfig: policies/example-read-config.yaml
    - name: ec2
      description: EC2 instance profile role for dev
      trust_policy: policies/ec2-trust.json
      managed_policy_arns:
        - arn:aws:iam::aws:policy/AmazonS3ReadOnlyAccess
        - arn:aws:iam::aws:policy/AmazonEC2ReadOnlyAccess
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
        - arn:aws:iam::aws:policy/AdministratorAccess 
      customer_managed_policies: [ ec2-instance-profile ]
    - name: default
      description: Default IAM role for dev
      trust_policy: policies/ec2-trust.json
      managed_policy_arns:
        - arn:aws:iam::aws:policy/AmazonS3ReadOnlyAccess
        - arn:aws:iam::aws:policy/AmazonEC2ReadOnlyAccess
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
      customer_managed_policies: [ default ]
    - name: source-replication
      description: IAM role for the dev replication rule
      trust_policy: policies/s3-trust.json
      customer_managed_policies: [ source-replication ]
  policies:
    - name: ec2-instance-profile
      description: EC2 instance permission for instances
      document: policies/ec2-instance-s3-permissions.json
    - name: default
      description: dev default role policy
      document: policies/ec2-instance-s3-permissions.json
    - name: source-replication
      description: IAM policy for dev source replication
      document: policies/s3-source-replication.json
  instance_profiles:
    - name: eks-nodes
      role: eks-nodes
    - name: ec2
      role: ec2

########################################
###### S3 Buckets ######
########################################
s3_buckets:
- name: app-bucket
  description: The application bucket for different apps
  versioning: true
  policy: policies/s3-app-bucket.json
  policy_variables:
    github_oidc_role: arn:aws:iam::533267408704:role/github-oidc-cdk-deploy-dev
- name: audit-bucket
  description: The audit bucket for different apps
  versioning: true
  policy: policies/s3-audit-bucket.json
  policy_variables:
    github_oidc_role: arn:aws:iam::533267408704:role/github-oidc-cdk-deploy-dev
- name: software-bucket
  description: The software bucket for different apps
  versioning: true
  objects:
  - key: Ansible_Tower/

########################################
###### Key Pairs and Certificates ######
########################################
key_pairs:
- name: key-pair
  create_secret: true
  secret_name: ec2-private-key-pairs
  secret_description: Private key for the dev VPC

certificates:
- name: dev
  domain_name: "*.dev.titancoretech.net"
  validation_method: DNS
  zone_name: titancoretech.net

########################################
###### EKS ######
########################################
eks:
  - name: main
    version: "1.36"
    role: eks-cluster
    subnet_tier: public
    security_groups: [ eks-cluster ]
    endpoint_public_access: true
    endpoint_private_access: false
    oidc_provider: true
    access_entries:
      admin:
        principal_arns:
        - arn:aws:iam::533267408704:role/aws-reserved/sso.amazonaws.com/AWSReservedSSO_AdministratorAccess_bc8f841762d141f5
        - arn:aws:iam::533267408704:role/aws-reserved/sso.amazonaws.com/AWSReservedSSO_SystemAdministrator_434e88f55ae46456
        policy_arn: arn:aws:eks::aws:cluster-access-policy/AmazonEKSClusterAdminPolicy
      readonly:
        roles: [eks-cluster]
        principal_arns:
        - arn:aws:iam::533267408704:role/aws-reserved/sso.amazonaws.com/AWSReservedSSO_ReadOnlyAccess_c8f66f34ed2a5abd
        kubernetes_groups: [cognitech-viewers, infogrid]
      audit:
        principal_arns:
        - arn:aws:iam::533267408704:role/aws-reserved/sso.amazonaws.com/AWSReservedSSO_NetworkAdministrator_7527e53ceb2ffa92
        policy_arn: arn:aws:eks::aws:cluster-access-policy/AmazonEKSViewPolicy
        kubernetes_groups: [cognitech-viewers]
    namespaces:
    - name: infogrid
      labels:
        team: infogrid-devops
    - name: movienight
      labels:
        app: movienight
    - name: healthpath
      labels:
        app: healthpath
      resource_quota:
        file: policies/healthpath_resource_quota.yaml
    - name: pulsehub
      labels:
        app: pulsehub
    rbac:
      cluster_roles:
      - name: cognitech-view
        rules:
        - api_groups: ["*"]
          resources: [deployments, pods, services]
          verbs: [get, list, watch]
      cluster_role_bindings:
      - name: view-binding
        cluster_role: cognitech-view
        subjects:
        - kind: Group
          name: cognitech-viewers
          api_group: rbac.authorization.k8s.io
      roles:
      - name: infogrid
        namespace: infogrid
        rules:
        - api_groups: ["*"]
          resources: [deployments, pods, services]
          verbs: [get, list, watch]
      role_bindings:
      - name: infogrid-binding
        namespace: infogrid
        role: infogrid
        subjects:
        - kind: Group
          name: infogrid
          api_group: rbac.authorization.k8s.io
    service_accounts:
    - name: healthpath-secrets
      namespace: healthpath
      identity: pod_identity
      policy: policies/healthpath-secrets.yaml
    - name: infogrid-s3
      namespace: infogrid
      identity: irsa
      policy: policies/infogrid-s3.yaml
    compute:
      launch_templates:
      - name: general
        key_pair: key-pair
        security_groups: [ eks-nodes ]
        volume_size: 20
        volume_type: gp3
      node_groups:
      - name: general
        role: eks-nodes
        launch_template: general
        labels:
          workload-type: system
        taints:
        - key: workload-type
          value: system
          effect: NO_SCHEDULE
        subnet_tier: public
        instance_types: [ t3.large ]
        min_size: 2
        desired_size: 2
        max_size: 3
    #   # Requires eks-pod-identity-agent in eks_addons and running worker nodes.
    #   karpenter:
    #     chart_version: 1.15.0
    #     node_role: eks-nodes
    #     replicas: 1
    #     subnet_tier: public
    #     security_groups: [ eks-nodes ]
    #     values:
    #       nodeSelector:
    #         workload-type: system
    #       tolerations:
    #       - {key: workload-type, operator: Equal, value: system, effect: NoSchedule}
    #     node_pool:
    #       instance_categories: [ t, m, c ]
    #       capacity_types: [ on-demand ]
    #       cpu_limit: 8
eks_addons:
- cluster: main
  addons:
  - name: vpc-cni
    # Keep the built-in DaemonSet placement/tolerations; do not pin to system.
  - name: coredns
    configuration_values:
      nodeSelector: {workload-type: system}
      tolerations:
      - {key: node-role.kubernetes.io/control-plane, effect: NoSchedule}
      - {key: workload-type, operator: Equal, value: system, effect: NoSchedule}
  - name: kube-proxy
    # Keep node-wide DaemonSet defaults.
  - name: eks-pod-identity-agent
    configuration_values:
      # Run on all eligible nodes, including tainted system nodes.
      tolerations:
      - {operator: Exists}
  - name: aws-ebs-csi-driver
    configuration_values:
      controller:
        nodeSelector: {workload-type: system}
        tolerations:
        - {operator: Exists, effect: NoExecute, tolerationSeconds: 300}
        - {key: workload-type, operator: Equal, value: system, effect: NoSchedule}
      node:
        tolerateAllTaints: true
        # No system selector: storage mounts are needed on application nodes too.
#   - name: aws-efs-csi-driver
#     configuration_values:
#       controller:
#         nodeSelector: {workload-type: system}
#         tolerations:
