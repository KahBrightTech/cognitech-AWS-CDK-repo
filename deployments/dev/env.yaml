account_id: "533267408704"
region: us-east-1
common:
  account_name: md-preproduction
  region_prefix: use1
  global: false
  account_name_abr: mdpreprod
  environment_abr: dev
  tags:
    Build-method: aws-cdk
    Environment: development
    ManagedBy: aws-cdk/cognitech-AWS-CDK-repo
    Owner: kbrigthain@gmail.com
    Compliance: hippaa

network:
  name: dev
  cidr_block: 10.20.0.0/16
  azs: 3 # 1 to 4 availability zones

  # false = VPC, internet gateway and public subnets only.
  #         No private subnets, no NAT gateways, no Elastic IPs.
  private_subnets: false

  # Exact subnet ranges, one per AZ in order. Leave them out and they are
  # carved from cidr_block using cidr_mask (default /24).
  public_subnet_cidrs:
  - 10.20.0.0/24
  - 10.20.1.0/24
  - 10.20.2.0/24
