#       tolerations: [{operator: Exists}]
#       secrets-store-csi-driver:
#         linux:
#           tolerations: [{operator: Exists}]
#       # Both the provider and CSI driver are node-wide DaemonSets.
  - name: metrics-server
    configuration_values:
      nodeSelector: {workload-type: system}
      tolerations:
      - {key: workload-type, operator: Equal, value: system, effect: NoSchedule}
  - name: external-dns
    configuration_values:
      nodeSelector: {workload-type: system}
      tolerations:
      - {key: workload-type, operator: Equal, value: system, effect: NoSchedule}
  - name: cert-manager
    configuration_values:
      nodeSelector: {workload-type: system}
      tolerations:
      - {key: workload-type, operator: Equal, value: system, effect: NoSchedule}
      cainjector:
        nodeSelector: {workload-type: system}
        tolerations:
        - {key: workload-type, operator: Equal, value: system, effect: NoSchedule}
      webhook:
        nodeSelector: {workload-type: system}
        tolerations:
        - {key: workload-type, operator: Equal, value: system, effect: NoSchedule}
  - name: amazon-cloudwatch-observability
    configuration_values:
      tolerations: [{operator: Exists}]
      manager:
        nodeSelector: {workload-type: system}
        tolerations:
        - {key: workload-type, operator: Equal, value: system, effect: NoSchedule}
      kubeStateMetrics:
        nodeSelector: {workload-type: system}
        tolerations:
        - {key: workload-type, operator: Equal, value: system, effect: NoSchedule}
  aws_load_balancer_controller:
    enabled: true
    chart_version: 3.6.0
    values:
      nodeSelector: {workload-type: system}
      tolerations:
      - {key: workload-type, operator: Equal, value: system, effect: NoSchedule}
  storage_class:
    name: gp3
  secrets_store_csi:
    chart_version: 3.1.4
    values:
      tolerations: [{operator: Exists}]
      secrets-store-csi-driver:
        install: true
        linux:
          tolerations: [{operator: Exists}]
