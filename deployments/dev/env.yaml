account_id: "533267408704"
region: us-east-1
common:
  account_name: md-preproduction
  region_prefix: use1
  global: false
  account_name_abr: mdpreprod
  environment_abr: dev
  tags:
    Build-method: aws-cdk
    Environment: development
    ManagedBy: aws-cdk/cognitech-AWS-CDK-repo
    Owner: kbrigthain@gmail.com
    Compliance: FedRAMP

network:
  name: dev
  cidr_block: 10.20.0.0/16
  azs: 3 # 1 to 4 availability zones
  private_subnets: false
  public_subnet_cidrs:
  - 10.20.0.0/24
  - 10.20.1.0/24
  - 10.20.2.0/24

# Security groups for the cluster and the resources around it. Each one is
# created by the security stack; `source`/`destination` is either another name
# in this list, a CIDR, an existing sg- id, or a pl- prefix list id.
security_groups:
- name: eks-cluster
  description: EKS control plane
  ingress:
  - description: API server from the nodes
    source: eks-nodes
    ports: 443

- name: eks-nodes
  description: EKS worker nodes
  ingress:
  - description: Node to node, all ports
    source: eks-nodes
    protocol: all
  - description: Control plane to kubelet
    source: eks-cluster
    ports: 10250
  - description: Control plane to webhooks and extension API servers
    source: eks-cluster
    ports: 443
  - description: Ingress controller to the NodePort range
    source: alb
    ports: 30000-32767

- name: alb
  description: Public load balancer in front of the cluster
  ingress:
  - description: HTTPS from anywhere
    source: 0.0.0.0/0
    ports: 443
  - description: HTTP from anywhere, redirected to HTTPS
    source: 0.0.0.0/0
    ports: 80
