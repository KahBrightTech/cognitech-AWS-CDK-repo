name: Deploy primary mdpp dev

# Deploys deployments/dev/ into the md-preproduction account (533267408704),
# us-east-1. One workflow per environment: nothing to pick, so there is no way
# to run it against the wrong account by mistake.
#
# Naming: deploy-<region role>-<account>-<environment>
#   primary = us-east-1   mdpp = md-preproduction   dev = deployments/dev/
#
# HOW IT RUNS
#   push to main  -> `cdk diff` only. Nothing is ever created or deleted
#                    automatically; the diff is written to the run summary.
#   Run workflow  -> choose diff (default), deploy, or destroy, and which
#                    stacks to act on.
#
# STACK SELECTION
#   Nothing is typed and no stack name is maintained by hand. `cdk list` asks
#   app.py what this environment builds, so registering a stack in app.py or
#   renaming one in deployments/dev/env.yaml is picked up automatically.
#
#   GitHub builds the "Run workflow" form from this file before any runner
#   exists, so a dropdown cannot be filled in while the job runs. Instead the
#   sync-stack-choices workflow runs `cdk list` whenever the app changes and
#   commits the result into the generated block below, so the dropdown is
#   detected rather than written. Do not edit those lines; run
#   `python scripts/sync_stack_choices.py` instead.
#
#   Picking "all" (the default) acts on every stack the run itself detects, so
#   it is right even if the dropdown has not been regenerated yet. Any other
#   choice is checked against `cdk list` before AWS is touched. Dependencies of
#   a selected stack are deployed too, as CDK normally does.
#
# The role ARN and region are written in below rather than stored as GitHub
# secrets or variables. Neither is a credential, and both already appear in
# deployments/dev/env.yaml. The only GitHub setup needed is an Environment
# named "dev".
on:
  # Shows what WOULD change when something affecting this stack lands on main.
  # A change to deployments/prod/ does not match, so it will not trigger here.
  push:
    branches: [main]
    paths:
      - "deployments/dev/**" # this environment's config
      - "src/**" # shared constructs and stacks
      - "app.py" # entrypoint
      - "cdk.json" # feature flags
      - "requirements*.txt" # pinned CDK version
      - ".github/workflows/deploy-primary-mdpp-dev.yml" # this file

  workflow_dispatch:
    inputs:
      action:
        description: What to do after the diff
        required: true
        default: diff
        type: choice
        options:
          - diff # review only, change nothing
          - deploy # create or update the stack
          - destroy # DELETE the stack and everything in it
      stacks:
        description: Stack to act on
        required: false
        default: all
        type: choice
        # BEGIN generated stack options -- scripts/sync_stack_choices.py
        options:
          - all
          - md-preproduction-use1-dev-network
        # END generated stack options
      confirm:
        description: 'Type "dev" to allow destroy (ignored otherwise)'
        required: false
        default: ""
        type: string

concurrency:
  group: deploy-mdpp-dev
  cancel-in-progress: false

permissions:
  id-token: write # required to request the OIDC token
  contents: read

jobs:
  cdk:
    name: "dev: ${{ inputs.action || 'diff' }} ${{ inputs.stacks || 'all' }}"
    runs-on: ubuntu-latest
    environment: dev
    env:
      ENV: dev
    steps:
      # Fail before touching AWS if a destroy was not explicitly confirmed.
      - name: Check destroy confirmation
        if: inputs.action == 'destroy' && inputs.confirm != 'dev'
        run: |
          echo "::error::Destroy requires the confirm box to contain exactly: dev"
          exit 1
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: |
          pip install -r requirements-dev.txt
          npm install -g aws-cdk@2
      - name: Run tests
        run: pytest -q
      - name: Synthesize
        run: cdk synth --quiet

      # Asks app.py what this environment builds, then turns the choice made in
      # the form into arguments for the cdk commands below. The input is read
      # from an env var, never interpolated into the script, so a crafted value
      # cannot run as shell code.
      - name: Select stacks
        env:
          REQUESTED: ${{ inputs.stacks }}
        run: |
          set -euo pipefail
          mapfile -t available < <(cdk list | sed '/^$/d')
          if [ "${#available[@]}" -eq 0 ]; then
            echo "::error::cdk list returned no stacks for ENV=$ENV"
            exit 1
          fi

          {
            echo "### Stacks detected in \`dev\`"
            echo
            printf -- '- `%s`\n' "${available[@]}"
            echo
          } >> "$GITHUB_STEP_SUMMARY"

          requested="${REQUESTED:-all}"
          [ -n "${requested// /}" ] || requested=all

          if [ "$requested" = "all" ]; then
            echo "TARGETS=--all" >> "$GITHUB_ENV"
            echo "SELECTED=all (${#available[@]} stack(s))" >> "$GITHUB_ENV"
            exit 0
          fi

          for have in "${available[@]}"; do
            if [ "$have" = "$requested" ]; then
              echo "TARGETS=$requested" >> "$GITHUB_ENV"
              echo "SELECTED=$requested" >> "$GITHUB_ENV"
              exit 0
            fi
          done

          # Only reachable if the dropdown is older than the app.
          echo "::error::'$requested' is not a stack in this environment, so the" \
               "list in the form is out of date. Run the sync-stack-choices" \
               "workflow. Available: ${available[*]}"
          exit 1

      - name: Show OIDC claims
        run: |
          token=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq -r .value)
          payload=$(echo "$token" | cut -d. -f2)
          # base64url -> base64, then pad to a multiple of 4
          payload=$(echo "$payload" | tr '_-' '/+')
          while [ $(( ${#payload} % 4 )) -ne 0 ]; do payload="${payload}="; done
          echo "$payload" | base64 -d | jq '{sub, aud, repository, environment, ref}'

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::533267408704:role/github-oidc-cdk-deploy-dev
          aws-region: us-east-1
          role-session-name: cdk-dev-${{ github.run_id }}

      # Always runs, whatever the action. On a push this is the whole job.
      - name: Diff
        run: |
          {
            echo '### `cdk diff` — dev: '"$SELECTED"
            echo
            echo '```'
            cdk diff $TARGETS 2>&1 | tee /dev/stderr
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Next step
        if: github.event_name == 'push'
        run: |
          {
            echo
            echo '> Review the diff above, then **Run workflow** on this'
            echo '> workflow, pick the stacks you want (or `all`) and choose'
            echo '> `deploy` to apply it.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Deploy
        if: inputs.action == 'deploy'
        run: cdk deploy $TARGETS --require-approval never --progress events

      - name: Destroy
        if: inputs.action == 'destroy'
        run: cdk destroy $TARGETS --force
