name: Deploy primary mdpp dev

# Deployment settings. YAML aliases reuse the environment and config path below.
env:
  ENV: &deployment_environment dev
  DEPLOYMENT_CONFIG_PATH: &deployment_config_path "deployments/dev/**"
  AWS_ROLE_ARN: arn:aws:iam::533267408704:role/github-oidc-cdk-deploy-dev
  AWS_PREVIEW_ROLE_ARN: arn:aws:iam::533267408704:role/github-oidc-cdk-preview-dev
  AWS_REGION: us-east-1

# When copying this workflow, also update its name, workflow-file push path, concurrency group,
# and confirmation description, then run scripts/sync_stack_choices.py.
on:
  push:
    branches: [main]
    paths:
      - *deployment_config_path 
      - "policies/**"
      - "src/**" 
      - "app.py"
      - "cdk.json"
      - "requirements*.txt"
      - ".github/workflows/deploy-primary-mdpp-dev.yml"

  workflow_dispatch:
    inputs:
      action:
        description: What to do after the diff
        required: true
        default: diff
        type: choice
        options:
          - diff # review only, change nothing
          - deploy # create or update the stack
          - destroy # DELETE the stack and everything in it
      stacks:
        description: Stack to act on
        required: false
        default: all
        type: choice
        # BEGIN generated stack options -- scripts/sync_stack_choices.py
        options:
          - all
          - md-preproduction-use1-dev-network
          - md-preproduction-use1-dev-security
          - md-preproduction-use1-dev-iam
          - md-preproduction-use1-dev-storage
          - md-preproduction-use1-dev-key-pairs
          - md-preproduction-use1-dev-certificates
          - md-preproduction-use1-dev-eks
        # END generated stack options
      confirm:
        description: 'Type "dev" to allow destroy (ignored otherwise)'
        required: false
        default: ""
        type: string

concurrency:
  group: deploy-mdpp-dev
  cancel-in-progress: false

permissions:
  id-token: write # required to request the OIDC token
  contents: read

jobs:
  preview:
    name: "Preview ${{ inputs.stacks || 'all' }}"
    runs-on: ubuntu-latest
    outputs:
      targets: ${{ steps.select.outputs.targets }}
    steps:
      # Fail before touching AWS if a destroy was not explicitly confirmed.
      - name: Check destroy confirmation
        if: inputs.action == 'destroy' && inputs.confirm != env.ENV
        run: |
          echo "::error::Destroy requires the confirm box to contain exactly: $ENV"
          exit 1
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: |
          pip install -r requirements-dev.txt
          npm install -g aws-cdk@2
      - name: Run tests
        run: pytest -q
      - name: Synthesize
        run: cdk synth --quiet
      - name: Select stacks
        id: select
        env:
          REQUESTED: ${{ inputs.stacks }}
        run: |
          set -euo pipefail
          mapfile -t available < <(cdk list | sed '/^$/d')
          if [ "${#available[@]}" -eq 0 ]; then
            echo "::error::cdk list returned no stacks for ENV=$ENV"
            exit 1
          fi

          {
            echo "### Stacks detected in \`$ENV\`"
            echo
            printf -- '- `%s`\n' "${available[@]}"
            echo
          } >> "$GITHUB_STEP_SUMMARY"

          requested="${REQUESTED:-all}"
          [ -n "${requested// /}" ] || requested=all

          if [ "$requested" = "all" ]; then
            echo "TARGETS=--all" >> "$GITHUB_ENV"
            echo "targets=--all" >> "$GITHUB_OUTPUT"
            echo "SELECTED=all (${#available[@]} stack(s))" >> "$GITHUB_ENV"
            exit 0
          fi

          for have in "${available[@]}"; do
            if [ "$have" = "$requested" ]; then
              echo "TARGETS=$requested" >> "$GITHUB_ENV"
              echo "targets=$requested" >> "$GITHUB_OUTPUT"
              echo "SELECTED=$requested" >> "$GITHUB_ENV"
              exit 0
            fi
          done

          # Only reachable if the dropdown is older than the app.
          echo "::error::'$requested' is not a stack in this environment, so the" \
               "list in the form is out of date. Run the sync-stack-choices" \
               "workflow. Available: ${available[*]}"
          exit 1

      - name: Show OIDC claims
        run: |
          token=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq -r .value)
          payload=$(echo "$token" | cut -d. -f2)
          # base64url -> base64, then pad to a multiple of 4
          payload=$(echo "$payload" | tr '_-' '/+')
          while [ $(( ${#payload} % 4 )) -ne 0 ]; do payload="${payload}="; done
          echo "$payload" | base64 -d | jq '{sub, aud, repository, environment, ref}'

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_PREVIEW_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: cdk-${{ env.ENV }}-${{ github.run_id }}

      # Avoid change-set creation: preview cannot assume deployment roles.
      - name: Diff
        run: |
          set -euo pipefail
          {
            echo '### `cdk diff` — '"$ENV: $SELECTED"
            echo
            echo '```'
            cdk diff $TARGETS --no-change-set 2>&1 | tee /dev/stderr
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Next step
        if: github.event_name == 'push'
        run: |
          {
            echo
            echo '> Review the diff above, then **Run workflow** on this'
            echo '> workflow, pick the stacks you want (or `all`) and choose'
            echo '> `deploy` to apply it.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Package reviewed assembly
        if: inputs.action == 'deploy' || inputs.action == 'destroy'
        run: tar -cf "$RUNNER_TEMP/cdk-assembly.tar" -C cdk.out .
      - name: Save reviewed assembly
        if: inputs.action == 'deploy' || inputs.action == 'destroy'
        uses: actions/upload-artifact@v4
        with:
          name: reviewed-cdk-assembly
          path: ${{ runner.temp }}/cdk-assembly.tar
          if-no-files-found: error
          retention-days: 7

  apply:
    name: "${{ inputs.action }} ${{ inputs.stacks || 'all' }}"
    needs: preview
    if: github.event_name == 'workflow_dispatch' && (inputs.action == 'deploy' || inputs.action == 'destroy')
    runs-on: ubuntu-latest
    environment: *deployment_environment
    env:
      TARGETS: ${{ needs.preview.outputs.targets }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install CDK
        run: npm install -g aws-cdk@2
      - name: Download reviewed assembly
        uses: actions/download-artifact@v4
        with:
          name: reviewed-cdk-assembly
          path: ${{ runner.temp }}/reviewed-assembly
      - name: Extract reviewed assembly
        run: |
          mkdir -p cdk.out
          tar -xf "$RUNNER_TEMP/reviewed-assembly/cdk-assembly.tar" -C cdk.out
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: cdk-${{ env.ENV }}-${{ github.run_id }}
      - name: Deploy
        if: inputs.action == 'deploy'
        run: cdk deploy --app cdk.out $TARGETS --require-approval never --progress events

      - name: Destroy
        if: inputs.action == 'destroy'
        run: cdk destroy --app cdk.out $TARGETS --force
