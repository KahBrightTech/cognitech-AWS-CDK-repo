name: CDK Deploy

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "deployments/**"
      - "app.py"
      - "cdk.json"
      - "requirements*.txt"
      - ".github/**"
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to deploy ("all" for every environment)
        required: true
        default: all
        type: string

concurrency:
  group: cdk-deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

jobs:
  select:
    name: Select environments
    runs-on: ubuntu-latest
    outputs:
      environments: ${{ steps.pick.outputs.environments }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Pick environments
        id: pick
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            result=$(python scripts/select_environments.py --only "${{ inputs.environment }}")
          else
            base="${{ github.event.before }}"
            if [ -z "$base" ] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
              base=$(git rev-parse HEAD~1)
            fi
            result=$(python scripts/select_environments.py --base "$base" --head "${{ github.sha }}")
          fi
          echo "Selected: $result"
          echo "environments=$result" >> "$GITHUB_OUTPUT"

  deploy:
    name: Deploy ${{ matrix.environment }}
    needs: select
    if: needs.select.outputs.environments != '[]'
    runs-on: ubuntu-latest
    # Protection rules on the matching GitHub Environment gate each deploy.
    environment: ${{ matrix.environment }}
    strategy:
      max-parallel: 1 # promote in order: uat, then prod
      fail-fast: true
      matrix:
        environment: ${{ fromJson(needs.select.outputs.environments) }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/cdk-deploy
        with:
          environment: ${{ matrix.environment }}
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
